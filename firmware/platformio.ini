; EMS Timer — PlatformIO 設定
; Impl-Phase A: OHCA 核心（8 鍵狀態機 + EPI 倒數 + 兩段確認）
;   - 對齊 docs/pm-dev-spec.md §四 Phase A 範圍
;   - GPIO 配置依 docs/gpio-allocation.md（SSOT）
;   - 廢止：lib/ems_logic/ems_countdown.{cpp,h} / ems_vent.{cpp,h}（已刪）
; 測試：pio test -e native（純邏輯單元測試，95 tests，不需硬體）
; 燒錄：pio run -e esp32-s3-devkitc-1 -t upload

[platformio]
; 預設 build target（`pio run` 不指定 env 時用）
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial monitor 速率
monitor_speed = 115200

; ESP32-S3 native USB：讓 Serial 走 USB CDC（usbmodem port）
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

; Phase E 自訂 partition table（保留 OTA + 12.19MB LittleFS）
;   詳見 partitions.csv 與 plan ticklish-exploring-dragonfly.md §1
board_build.partitions = partitions.csv

; 指定 filesystem 為 littlefs，讓 buildfs / uploadfs 走 littlefs 流程
; （subtype 字面值與 partition label name 的搭配理由見 partitions.csv 標頭）
board_build.filesystem = littlefs

; N16R8 16MB flash override — board JSON 預設 8MB，partitions.csv 規劃 littlefs
; 跨到 0x1000000（16MB 邊界）。不覆寫 → bootloader 驗 partition 超界 →
; RTC_SW_SYS_RST 無限重置（症狀：boot log 反覆出現，無 Guru Meditation）。
board_upload.flash_size = 16MB
board_build.flash_size = 16MB

; Post-build：merge bootloader + partition + app 成 firmware-merged.bin，
; 供 release-template/flash.sh|.bat 從 0x0 直接燒（純 app bin 從 0x0 燒會蓋 bootloader）
extra_scripts = post:scripts/post_build_merge.py

; 函式庫依賴（LittleFS 為 ESP32 Arduino core 內建，不需另外加）
; 顯示：2.8" ST7789 SPI TFT（取代 1.3" SH1106 OLED）
;   - LovyanGFX：DMA push + sprite buffer + 內建 fonts::FreeMonoBold24pt7b 等 GFX 字型
;     徹底消除 Adafruit_GFX byte-swap CPU overhead
; RTC：DS3231 I2C 模組（lib/ems_rtc/ds3231_backend.cpp 包裝；rtc-demo env 已驗證 API）
;   - RTClib 2.x 透過 Adafruit_BusIO 抽象 I2C/SPI，與 LovyanGFX 並存時 LDF 預設
;     chain+ 模式不會把 framework 的 SPI/Wire include path 帶進 BusIO 的編譯，
;     需切 deep+ 讓 LDF 深掃所有相依
lib_ldf_mode = deep+
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/RTClib @ ^2.1.4

; ============================================================
; Native 測試環境：跑 lib/ems_logic 的純邏輯單元測試
; 執行：pio test -e native
; ============================================================
[env:native]
platform = native
test_framework = unity

; ems_storage 邏輯層用 ArduinoJson 7 處理 index.json（header-only，native 可用）
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

; 不把 src/ 編進 native build（main.cpp 依賴 Arduino.h 不可用）
build_src_filter = -<*>

; 只編 test 和 lib
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -I$PROJECT_LIB_DIR

; ============================================================
; Static analysis：cppcheck 掃 src/ + lib/ems_*
; 執行：pio check -e check
; 用途：抓 null deref / buffer overflow / uninitialized / use after free 等
;       不依賴執行時機的 bug，不需上板
; 對齊：tasks/testing-infrastructure.md #4
; ============================================================
[env:check]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; cppcheck（內建 PlatformIO 支援；首次跑會自動安裝 tool-cppcheck）
check_tool = cppcheck

; 過濾範圍：只看自家程式碼，跳過 framework / 第三方 lib
check_src_filters =
    +<src/>
    +<lib/ems_*/>

; 嚴重度過濾：先看 medium 以上，避開 style 大量噪音
check_severity = medium, high

; 跳過 framework 套件本身
check_skip_packages = yes

; cppcheck 細部參數
check_flags =
    cppcheck: --enable=warning,performance,portability --suppress=missingInclude --inline-suppr --std=c++17

; ============================================================
; On-target Unity test：上 ESP32-S3 跑真實 LittleFS / NVS / partition table
; 執行：pio test -e esp32-s3-test
; 用途：補 native unit test 無法涵蓋的硬體面 — LittleFS mount/format、
;       partition table boundary、storage_save → ESP.restart() → storage_load
;       的跨重啟持久化驗證（Phase F BLE 配對 + 真 LittleFS 必上板測）
; 對齊：tasks/testing-infrastructure.md #3
; ============================================================
[env:esp32-s3-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; 與主韌體一致，避免測試版改 layout 後燒回主韌體要重做 partition
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.flash_size = 16MB

; ESP32-S3 native USB CDC：Serial 印到 USB 才能讓 pio test 讀 Unity output
; UNITY_SUPPORT_64：ESP32-S3 是 32-bit，Unity auto-detect 不會開 64-bit assert，
;   會造成 TEST_ASSERT_EQUAL_UINT64 一律報「Unity 64-bit Support Disabled」失敗
; 註：Arduino-ESP32 v2.x 的 ARDUINO_LOOP_STACK_SIZE 由 sdkconfig.h 鎖死 8KB，
;   -D 無效（會出 redefined warning）。若日後出現 stack overflow，要用
;   runtime API `setLoopStackSize()`（v3.x）或自己 xTaskCreate 開大 stack 跑 test。
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUNIT_TEST
    -DUNITY_SUPPORT_64

; Unity 測試框架
test_framework = unity

; 只跑 on-target 用的 test dir；其他 test_* 為 native env 專用，誤跑會 link 失敗
test_filter = test_storage_hw

; 不編 src/main.cpp（pio test 預設會編 src/，但這裡測試自帶 setup/loop）
build_src_filter = -<*>

; storage logic 用 ArduinoJson 7 處理 index.json
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

; 注意：刻意不掛 post:scripts/post_build_merge.py
;   - 測試 binary 不需要 merged.bin（pio test 自己處理上板流程）
;   - post_build 驗證腳本預期主韌體 layout，跑會誤報

; ============================================================
; TFT 接線 smoke test（獨立環境，不影響 Impl-Phase A 主韌體）
; 用途：驗證 ST7789V 2.8" 240x320 模組接線是否正確
; 燒錄：pio run -e tft-smoke-test -t upload
; 監看：pio device monitor -e tft-smoke-test
; 對應 source：src_tft_test/main.cpp（不會編進主韌體）
; 接線依據：docs/gpio-allocation.md §5.2
; ============================================================
[env:tft-smoke-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; 同主韌體用 partitions.csv（保持 flash layout 一致，避免燒測試版後主韌體需重做 partition）
board_build.partitions = partitions.csv

; 同主 env：覆寫 board 預設 8MB → 16MB，避免 partition 驗證超界
board_upload.flash_size = 16MB
board_build.flash_size = 16MB

; 只編 src_tft_test/，不編 src/main.cpp
build_src_filter = -<*> +<../src_tft_test/main.cpp>

; Post-build：merge_bin 產 firmware-merged-tft-smoke-test.bin（檔名 suffix 區分主韌體）
extra_scripts = post:scripts/post_build_merge.py

; ⚠️ 為什麼用 Adafruit_ST7789 而非 TFT_eSPI：
;   實機（ESP32-S3 N16R8 octal PSRAM）上 TFT_eSPI 2.5.43 在 init() 暫存器層存取
;   SPI controller 時直接 StoreProhibited（lib 自己原始碼註解 "Draws once then freezes"，
;   見 .pio/libdeps/.../TFT_eSPI/Processors/TFT_eSPI_ESP32.c）。
;   Adafruit 走標準 Arduino SPI，不玩 register hack，ESP32-S3 上穩。
;   速度差異對 EMS Timer 顯示需求（每 0.5 秒更新計時）可忽略。
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.0
    adafruit/Adafruit GFX Library @ ^1.11.9

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

; ============================================================
; I2C Scanner smoke test（獨立環境，不影響 Impl-Phase A 主韌體）
; 用途：掃描 I2C bus，驗證 DS3231 RTC 與 MAX17043 燃料計接線（GPIO 42=SDA / 41=SCL）
; 燒錄：pio run -e i2c-scan -t upload
; 監看：pio device monitor -e i2c-scan
; 對應 source：src_i2c_scan/main.cpp（不會編進主韌體）
; 接線依據：docs/gpio-allocation.md §5.4（I2C bus 分配）
;           docs/power-module-purchase.md §10.7（MAX17043 實體板接線與安全測試 SOP）
; 預期輸出：偵測到 0x68（DS3231）與 0x36（MAX17043）；DS3231 模組附 EEPROM 還會多 0x57
;           對照表內未回應的裝置會另列「已知裝置未回應」清單
; ============================================================
[env:i2c-scan]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; 同主韌體 partition（避免燒測試版後主韌體需重做 layout）
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.flash_size = 16MB

; 只編 src_i2c_scan/，不編 src/main.cpp
build_src_filter = -<*> +<../src_i2c_scan/main.cpp>

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

; ============================================================
; MAX17043 燃料計 Quick Check（獨立環境，不影響 Impl-Phase A 主韌體）
; 用途：讀 VCELL / SOC 暫存器，確認燃料計讀數合理且 VDD 吃到真實電池電壓
; 前提：先用 i2c-scan 確認位址 0x36 在線
; 燒錄：pio run -e fuel-gauge-check -t upload
; 監看：pio device monitor -e fuel-gauge-check
; 對應 source：src_fuel_gauge_check/main.cpp（不會編進主韌體）
; 接線依據：docs/power-module-purchase.md §10.7（VDD 由電池供電，VCC 排針不接）
; 預期輸出：VCELL 落在 3.0~4.2V 且與電表實測差距 < 0.05V；SOC 為對應的電量百分比
; ============================================================
[env:fuel-gauge-check]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; 同主韌體 partition（避免燒測試版後主韌體需重做 layout）
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.flash_size = 16MB

; 只編 src_fuel_gauge_check/，不編 src/main.cpp
build_src_filter = -<*> +<../src_fuel_gauge_check/main.cpp>

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

; ============================================================
; DS3231 RTC Demo（獨立環境，不影響 Impl-Phase A 主韌體）
; 用途：用 RTClib 讀寫時間，驗證電池備援（拔 USB → 等 → 重上電，時間應不歸零）
; 燒錄：pio run -e rtc-demo -t upload
; 監看：pio device monitor -e rtc-demo
; 對應 source：src_rtc_demo/main.cpp（不會編進主韌體）
; 接線依據：docs/gpio-allocation.md §5.4 DS3231 RTC 擴充
; ============================================================
[env:rtc-demo]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.flash_size = 16MB

; 只編 src_rtc_demo/，不編 src/main.cpp
build_src_filter = -<*> +<../src_rtc_demo/main.cpp>

lib_deps =
    adafruit/RTClib @ ^2.1.4

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

; ============================================================
; BLE Time Sync Smoke Test（獨立環境，不影響 Impl-Phase A 主韌體）
; 用途：端對端驗證 docs/ble-time-sync-protocol.md spec
;       配合 docs/ble-tester/ 網頁端在瀏覽器發 time_sync 並收 ACK
; 燒錄：pio run -e ble-time-sync-smoke -t upload
; 監看：pio device monitor -e ble-time-sync-smoke
; 對應 source：src_ble_time_sync_smoke/main.cpp（不會編進主韌體）
; ============================================================
[env:ble-time-sync-smoke]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.flash_size = 16MB

; 只編 src_ble_time_sync_smoke/，不編 src/main.cpp
build_src_filter = -<*> +<../src_ble_time_sync_smoke/main.cpp>

; lib_deps 留空，依賴：
;   - lib/ems_time_sync/（auto-discovered，依賴 ArduinoJson）
;   - ArduinoJson 7（由 ems_time_sync 經 lib transitive 帶入）
;   - BLEDevice / BLEServer / BLE2902（ESP32 Arduino framework 內建，無需 lib_deps）
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
