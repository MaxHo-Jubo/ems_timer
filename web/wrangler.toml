name = "ems-timer-sync"
compatibility_date = "2025-07-18"
pages_build_output_dir = "public"

# D1 database binding
# 本機開發：database_id 可任意 UUID（wrangler --local 不檢查雲端對應）
# 部署前：`wrangler d1 create ems-timer-cases` 取得真 ID 後替換下方 UUID
[[d1_databases]]
binding = "DB"
database_name = "ems-timer-cases"
database_id = "00000000-0000-4000-8000-000000000001"
