# EMS Timer — GitLab CI/CD
# - pages: 發佈 docs/ 為 GitLab Pages 靜態站
# 注意：test job 已移除（此 GitLab 實例無可用 runner）；單元測試改本機執行：
#   pio test -e native -d firmware

pages:
  image: alpine:latest
  script:
    - mkdir -p public
    # 互動版 HTML 規格當首頁
    - cp docs/ems-flow-spec.html public/index.html
    # MD 規格直接放旁邊，供直連瀏覽/下載
    - cp docs/*.md public/
    # 同時保留 HTML 原檔（方便直連）
    - cp docs/*.html public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
