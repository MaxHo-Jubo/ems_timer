<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0a">
<title>EMS DoseSync Pro — 互動 Demo</title>
<style>
  /* === 全域 reset === */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; overflow: hidden; background: #1a1a1a; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  #app {
    width: 100%; max-width: 480px; height: 100%; max-height: 900px;
    display: flex; flex-direction: column;
    background: #0a0a0a; position: relative;
  }

  /* === 頂部 status === */
  #status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 12px; font-size: 11px; color: #64748b;
    background: #050505; border-bottom: 1px solid #222;
  }
  #status-bar .speed-badge {
    background: #1e3a5f; color: #93c5fd; padding: 2px 8px; border-radius: 8px; font-weight: 700;
  }
  #status-bar .state-badge { font-family: "Courier New", monospace; }

  /* === LED bar === */
  #led-bar {
    height: 6px; background: #050505; transition: background 0.1s;
  }
  #led-bar.led-yellow-slow { animation: ledYellowSlow 1.6s infinite; }
  #led-bar.led-red-fast    { animation: ledRedFast 0.3s infinite; }
  #led-bar.led-red-slow    { animation: ledRedSlow 1.6s infinite; }
  #led-bar.led-green-flash { animation: ledGreen 0.5s 2; }
  #led-bar.led-vent-pulse  { animation: ledVentPulse 0.3s 1; }
  @keyframes ledYellowSlow { 0%, 50% { background: #050505; } 25% { background: #f59e0b; } }
  @keyframes ledRedFast    { 0%, 100% { background: #050505; } 50% { background: #ef4444; } }
  @keyframes ledRedSlow    { 0%, 70% { background: #050505; } 30% { background: #ef4444; } }
  @keyframes ledGreen      { 0%, 100% { background: #050505; } 50% { background: #22c55e; } }
  @keyframes ledVentPulse  { 0%, 100% { background: #050505; } 50% { background: #ef4444; } }

  /* === 2.8" TFT 320×240 物理螢幕（對齊韌體 ST7789 實機 layout）=== */
  /* 以韌體實機解析度為準，所有內容字級套用 efontTW_24 / FreeMonoBold24pt7b 對應 px */
  #screen {
    width: 320px; height: 240px;
    flex: none; margin: 8px auto;
    background: #000; position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    border: 2px solid #2a2a2a; border-radius: 4px;
    box-shadow: 0 0 0 4px #1a1a1a, 0 4px 12px rgba(0, 0, 0, 0.6);
  }
  #screen.flash-red { animation: flashRed 0.6s infinite; }
  @keyframes flashRed { 0%, 100% { background: #000; } 50% { background: #4a0000; } }
  #screen.flash-vent { background: #5a0000; }

  #screen-watermark {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-20deg);
    font-size: 56px; color: rgba(96, 165, 250, 0.08); font-weight: 900; letter-spacing: 8px;
    pointer-events: none; white-space: nowrap;
  }
  #screen-watermark.show { display: block; }
  #screen-watermark.hide { display: none; }

  #screen-content {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8px; position: relative; z-index: 1;
  }

  /* === 螢幕通用 components ===
   * 字級對齊韌體（efontTW_24 = 24px / 1.2x ≈ 29px / 1.5x ≈ 36px / 2x ≈ 48px；
   *           FreeMonoBold24pt7b size 2 ≈ 96px）
   */
  .scr-title { font-size: 18px; color: #94a3b8; letter-spacing: 2px; margin-bottom: 4px; text-transform: uppercase; }
  .scr-mode  { font-size: 18px; color: #4ade80; margin-bottom: 6px; letter-spacing: 2px; font-weight: 700; }
  .scr-time-big { font-size: 96px; font-weight: 900; line-height: 1; font-family: "Courier New", monospace; color: #fff; }
  .scr-time-amber { color: #fbbf24; }
  .scr-time-red   { color: #ef4444; }
  .scr-label   { font-size: 29px; color: #cbd5e1; margin-top: 8px; }
  .scr-counter { font-size: 24px; color: #64748b; margin-top: 8px; font-family: "Courier New", monospace; }
  .scr-alert-big { font-size: 56px; font-weight: 900; letter-spacing: 4px; color: #fff; }
  .scr-flash-msg { font-size: 36px; font-weight: 700; color: #fff; text-align: center; }
  .scr-flash-sub { font-size: 24px; color: #94a3b8; margin-top: 6px; }

  .scr-vent-num { font-size: 96px; font-weight: 900; line-height: 1; color: #fff; font-family: "Courier New", monospace; }
  .scr-vent-num.emphasis { color: #fff; }
  .scr-vent-label { font-size: 24px; color: #94a3b8; margin-top: 4px; letter-spacing: 2px; }
  .scr-vent-epi-hint { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 18px; color: #cbd5e1; font-family: "Courier New", monospace; }
  .scr-vent-epi-hint.warning { color: #fbbf24; }
  .scr-vent-epi-hint.alarm   { color: #ef4444; }

  /* V1 §14：OHCA 主畫面內 6秒通氣恆常顯示輔助區塊（韌體右上角小 overlay） */
  .scr-vent-overlay {
    position: absolute; top: 4px; right: 8px; padding: 0;
    text-align: right; transition: background 120ms;
  }
  .scr-vent-overlay-label { font-size: 18px; color: #fbbf24; letter-spacing: 0; font-weight: 700; }
  .scr-vent-overlay-num   { font-size: 24px; font-weight: 700; color: #94a3b8; font-family: inherit; line-height: 1; }
  .scr-vent-overlay.beat-1 .scr-vent-overlay-num { color: #fff; }
  .scr-vent-overlay.beat-1 {
    background: #7f1d1d; border-radius: 4px; border-top-color: transparent;
    padding: 6px 8px;
  }
  .scr-vent-overlay.beat-1 .scr-vent-overlay-label { color: #fecaca; }
  .scr-vent-overlay.beat-1 .scr-vent-overlay-num   { color: #fff; }

  /* === Menu list（韌體：efontTW_24 標題 size 1.2 ≈ 29px / 項目 size 1 = 24px / 36px row） === */
  .menu-list { width: 100%; max-width: 320px; padding: 0; }
  .menu-item { padding: 6px 24px; font-size: 24px; color: #94a3b8; border-radius: 0; line-height: 36px; }
  .menu-item.selected { background: #fff; color: #000; font-weight: 700; }
  /* 韌體只有反白 highlight、沒有 ▶ 箭頭，故隱藏 cursor 元素 */
  .menu-item .menu-cursor { display: none; }
  .menu-header { font-size: 29px; color: #4ade80; letter-spacing: 0; margin-bottom: 8px; text-align: center; text-transform: none; font-weight: 700; padding-top: 4px; border-bottom: 1px solid #334155; padding-bottom: 6px; }

  /* === Confirm dialog（韌體 320×240 同尺寸） === */
  #overlay {
    position: absolute; inset: 0; background: rgba(0, 0, 0, 0.92);
    display: none; align-items: center; justify-content: center; z-index: 10;
    padding: 12px;
  }
  #overlay.show { display: flex; }
  .dialog {
    background: #111; border: 2px solid #f59e0b; border-radius: 8px;
    padding: 12px; max-width: 320px; width: 100%; text-align: center;
  }
  .dialog.danger { border-color: #ef4444; }
  .dialog-title { font-size: 29px; font-weight: 700; color: #fff; margin-bottom: 8px; }
  .dialog-body  { font-size: 24px; color: #94a3b8; line-height: 1.4; margin-bottom: 8px; }
  .dialog-hint  { font-size: 18px; color: #64748b; padding-top: 6px; border-top: 1px solid #333; }

  /* === Summary（密度高：320×240 內塞下 EPI/電擊/Amio 三大區，韌體 size 1=24px / 1.2=29px） === */
  .summary-box { width: 100%; padding: 0 8px; font-size: 18px; }
  .summary-box .sum-row { display: flex; justify-content: space-between; padding: 1px 0; border-bottom: 1px solid #1e293b; line-height: 1.2; }
  .summary-box .sum-row .sum-key { color: #94a3b8; }
  .summary-box .sum-row .sum-val { color: #fff; font-family: "Courier New", monospace; font-weight: 700; }
  .summary-box .sum-section { color: #4ade80; font-size: 18px; letter-spacing: 0; margin: 4px 0 1px; font-weight: 700; }

  .timeline-box { width: 100%; padding: 0 8px; font-family: "Courier New", monospace; font-size: 18px; }
  .timeline-box .tl-row { padding: 1px 0; display: flex; gap: 8px; line-height: 1.3; }
  .timeline-box .tl-time { color: #4ade80; min-width: 56px; }
  .timeline-box .tl-time-na { color: #64748b; }
  .timeline-box .tl-event { color: #fff; }
  .timeline-box .tl-event-supp { color: #fbbf24; }
  .timeline-box .tl-event-end { color: #94a3b8; }

  /* === Buttons 區 === */
  #buttons {
    background: #1a1a1a; padding: 12px 12px 16px;
    display: flex; flex-direction: column; gap: 8px;
    border-top: 1px solid #2a2a2a;
  }
  .btn-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .btn {
    padding: 14px 0; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 700; color: #fff;
    background-color: #2a2a2a; touch-action: manipulation;
    transition: transform 0.05s, background-color 0.1s;
    font-family: inherit; cursor: pointer;
    position: relative; overflow: hidden;
  }
  .btn:active { transform: scale(0.95); }
  .btn-epi   { background-color: #b91c1c; font-size: 22px; line-height: 1; }
  .btn-shock { background-color: #d97706; font-size: 22px; line-height: 1; }
  .btn-back  { background-color: #475569; }
  .btn-up    { background-color: #475569; }
  .btn-down  { background-color: #475569; }
  .btn-power { background-color: #1e293b; font-size: 11px; color: #64748b; }
  .btn-main  {
    width: 100%; padding: 22px 0; font-size: 18px;
    background-image: linear-gradient(180deg, #2563eb, #1e40af); color: #fff;
    border-radius: 16px; font-weight: 900; letter-spacing: 8px;
    box-shadow: 0 4px 0 #1e3a8a;
  }
  .btn-main:active { box-shadow: 0 2px 0 #1e3a8a; transform: translateY(2px); }

  /* 長按進度填充：按下後 0.75s 從左填滿到右；達門檻轉為 long-fired 持續高亮 */
  .btn::before {
    content: ''; position: absolute; inset: 0;
    background: rgba(245, 158, 11, 0.6);
    transform: translateX(-100%);
    transition: none;
    pointer-events: none;
    z-index: 0;
  }
  .btn.pressing::before {
    transform: translateX(0);
    transition: transform 0.75s linear;
  }
  .btn.long-fired::before {
    transform: translateX(0);
    background: rgba(245, 158, 11, 0.85);
    transition: none;
  }
  .btn > * { position: relative; z-index: 1; }
  /* button 文字本身不在子元素中，需用 text-shadow 確保填充期間仍可讀 */
  .btn { text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4); }

  .btn-hint { font-size: 9px; color: #64748b; text-align: center; padding: 2px 0 0; letter-spacing: 1px; font-weight: 400; }

  /* === Speed control 隱藏式 === */
  #speed-toggle { font-size: 10px; color: #64748b; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
  #speed-toggle:hover { background: #1e293b; }
</style>
</head>
<body>
<div id="app">

  <div id="status-bar">
    <span class="state-badge" id="state-name">MAIN_MENU</span>
    <span class="speed-badge" id="speed-toggle">8x ⏵</span>
  </div>

  <div id="led-bar"></div>

  <div id="screen">
    <div id="screen-watermark" class="hide">TRAINING</div>
    <div id="screen-content"></div>
    <div id="overlay"></div>
  </div>

  <div id="buttons">
    <div class="btn-row">
      <button class="btn btn-shock" data-btn="SHOCK" aria-label="電擊鍵">⚡</button>
      <button class="btn btn-up"    data-btn="UP" aria-label="上鍵">▲</button>
      <button class="btn btn-epi"   data-btn="EPI" aria-label="EPI 鍵">💉</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-back"  data-btn="BACK">返回</button>
      <button class="btn btn-down"  data-btn="DOWN">▼</button>
      <button class="btn btn-power" data-btn="POWER">⏻ Power</button>
    </div>
    <button class="btn btn-main" data-btn="MAIN">主鍵</button>
    <div class="btn-hint">短按 = 確認 / 選取　│　長按 ≥ 0.75s = 結束 / 進入子選單</div>
  </div>

</div>

<script>
'use strict';

// ============================================================
// SECTION 1：常數與 Speed 設定
// ============================================================

/** 倒數 4 分鐘對應的真實毫秒（1x 速度時） */
const EPI_CYCLE_REAL_MS         = 240_000;
/** 進入 WARNING 階段的剩餘時間門檻（剩 1 分鐘） */
const EPI_WARNING_REMAINING_MS  = 60_000;
/** ALARMING 階段持續發報的時長（5 秒） */
const EPI_ALARM_INITIAL_MS      = 5_000;
/** 超時後每 N ms 短嗶提醒一次 */
const EPI_OVERTIME_REMIND_MS    = 15_000;
/** WARNING 階段每 N ms 短嗶一次 */
const EPI_WARN_BEEP_MS          = 15_000;
/** 通氣節奏 1 拍 = 1 秒（依 V1 §13.6 執行中畫面） */
const VENT_BEAT_REAL_MS         = 1_000;
/** 兩段確認 timeout（首次按下 N ms 內未再按則自動取消） */
const CONFIRM_TIMEOUT_REAL_MS   = 5_000;
/** 長按判定門檻（ms） */
const LONG_PRESS_THRESHOLD_MS   = 750;
/** Tick 頻率（demo render + 計時用） */
const TICK_INTERVAL_MS          = 100;
/** 過場閃顯預設停留時間 */
const FLASH_DEFAULT_MS          = 1_200;

/** 倒數加速倍率（URL ?speed=8x），影響「OHCA EPI 倒數 + 通氣節拍 + Training 倒數」 */
const SPEED_MULT = (() => {
  const raw = new URLSearchParams(location.search).get('speed') || '8x';
  const num = parseInt(raw, 10);
  return (num >= 1 && num <= 64) ? num : 8;
})();

/** 設定預設值（V1 §19） */
const DEFAULT_SETTINGS = {
  brightness: 3,   // 1~5（最低 1，無關機）
  sysVolume:  3,   // 1~5（不可靜音）
  ventVolume: 3,   // 0~5（0 = 靜音）
};
const SETTINGS_STORAGE_KEY    = 'ems_settings_v1';
const HISTORY_OHCA_KEY        = 'ems_history_ohca_v1';
const HISTORY_TRAINING_KEY    = 'ems_history_training_v1';
const HISTORY_OHCA_LIMIT      = 50;     // V1 §12.4
const HISTORY_TRAINING_LIMIT  = 20;     // V1 §12.4

/** Training 倒數可選長度（ms，真實時間） */
const TRAINING_DURATIONS_MS = [30_000, 60_000, 240_000];
const TRAINING_DURATION_LABELS = ['30 秒', '1 分鐘', '4 分鐘'];

/** 裝置資訊 mock（V1 §19.7；demo 限制不能由 App 寫入） */
const DEVICE_MOCK = {
  name:        '未命名',
  model:       'EMS DoseSync Pro',
  serial:      'DSP-DEMO',
  fwVersion:   'v1.0.0-demo',
  battery:     86,
  charging:    true,
};

// ============================================================
// SECTION 2：設定 + 音效（Web Audio）+ 震動 + LED
// ============================================================

/** 從 localStorage 讀取設定，merge 預設值補齊缺失欄位 */
function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_STORAGE_KEY);
    if (!raw) return { ...DEFAULT_SETTINGS };
    return { ...DEFAULT_SETTINGS, ...JSON.parse(raw) };
  } catch (_) {
    return { ...DEFAULT_SETTINGS };
  }
}
function saveSettings() {
  try { localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(SETTINGS)); } catch (_) {}
}
let SETTINGS = loadSettings();

/** 套用螢幕亮度：brightness 1~5 → CSS filter 0.4~1.0 */
function applyBrightness() {
  const v = (SETTINGS.brightness - 1) / 4 * 0.6 + 0.4;
  document.getElementById('screen').style.filter = `brightness(${v})`;
}

let audioCtx = null;
let alarmOsc = null;
let alarmGain = null;

/** 首次 user gesture 時 init AudioContext（Mobile Safari 限制） */
function ensureAudio() {
  if (audioCtx) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (Ctx) audioCtx = new Ctx();
}

/** 底層發聲；不套任何音量縮放 */
function _beepRaw(freq, durationMs, volume, type = 'square') {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durationMs / 1000);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + durationMs / 1000);
}

/** 一般系統嗶（套系統音量 1~5） */
function beep(freq, durationMs, baseVolume = 0.25, type = 'square') {
  _beepRaw(freq, durationMs, baseVolume * (SETTINGS.sysVolume / 5), type);
}

/** 通氣專用嗶（套通氣音量 0~5；0 = 完全靜音） */
function ventBeep(freq, durationMs, baseVolume) {
  if (SETTINGS.ventVolume === 0) return;
  _beepRaw(freq, durationMs, baseVolume * (SETTINGS.ventVolume / 5));
}

/** 連續高優先警報音（ALARMING 用）— 持續發聲直到 stopAlarm() */
function startAlarm() {
  if (!audioCtx || alarmOsc) return;
  alarmOsc  = audioCtx.createOscillator();
  alarmGain = audioCtx.createGain();
  alarmOsc.type = 'square';
  alarmOsc.frequency.value = 1200;
  alarmGain.gain.value = 0.3 * (SETTINGS.sysVolume / 5);
  alarmOsc.connect(alarmGain).connect(audioCtx.destination);
  alarmOsc.start();
}
function stopAlarm() {
  if (!alarmOsc) return;
  try { alarmOsc.stop(); } catch (_) {}
  alarmOsc = null;
  alarmGain = null;
}

/** 震動 helper（不支援會 silently fail） */
function vibrate(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

const led = document.getElementById('led-bar');
/** 設定 LED 模式：'off' / 'yellow_slow' / 'red_fast' / 'red_slow' / 'green_flash' / 'vent_pulse' */
function setLed(mode) {
  led.className = mode === 'off' ? '' : `led-${mode.replace(/_/g, '-')}`;
}

// ============================================================
// SECTION 3：全域 state machine
// ============================================================

const screenContent = document.getElementById('screen-content');
const screenEl      = document.getElementById('screen');
const overlay       = document.getElementById('overlay');
const stateNameEl   = document.getElementById('state-name');
const watermark     = document.getElementById('screen-watermark');

let currentState = null;
/** 每個 state 的 ephemeral 資料（如 menu cursor、confirm 時 first_press 時間等） */
let stateData = {};

/** 跳到指定 state，觸發 onExit / onEnter */
function go(stateName, data = {}) {
  if (currentState && STATES[currentState]?.onExit) {
    STATES[currentState].onExit();
  }
  currentState = stateName;
  stateData = data;
  stateNameEl.textContent = stateName;
  if (STATES[stateName]?.onEnter) {
    STATES[stateName].onEnter();
  }
  render();
}

/** 由當前 state 決定要 render 什麼；不改 state */
function render() {
  if (!currentState) return;
  const s = STATES[currentState];
  if (s?.render) s.render();
}

// ============================================================
// SECTION 4：OHCA case 資料結構
// ============================================================

/** 當前 OHCA case；null = 沒有進行中的案件 */
let ohcaCase = null;

function newOhcaCase() {
  // V1 §14.12：新案件開始時清除前次殘留的 6秒給氣狀態（案件結束規則）
  stopVent();
  ohcaCase = {
    startedAt:                performance.now(),  // real ms when case started
    lastEpiRealAt:            null,               // real ms of last local EPI confirm（null = 待本機 EPI）
    events:                   [],                 // ems_event_t[]
    locked:                   false,
    alarmingEnteredSimMs:     null,               // sim ms within current cycle when entered ALARMING
    warningLastBeepSimMs:     null,
    overtimeLastReminderSimMs:null,
  };
}

/** 從案件起算的模擬經過毫秒（含加速） */
function caseElapsedSimMs() {
  if (!ohcaCase) return 0;
  return (performance.now() - ohcaCase.startedAt) * SPEED_MULT;
}
/** 從上次本機 EPI 起算的模擬毫秒；待本機 EPI 時回 null */
function sinceLastEpiSimMs() {
  if (!ohcaCase || !ohcaCase.lastEpiRealAt) return null;
  return (performance.now() - ohcaCase.lastEpiRealAt) * SPEED_MULT;
}
/** 計算當前 OHCA EPI 倒數階段 */
function ohcaPhase() {
  if (!ohcaCase) return null;
  const t = sinceLastEpiSimMs();
  if (t === null) return 'WAIT_FIRST_EPI';
  if (t < EPI_CYCLE_REAL_MS - EPI_WARNING_REMAINING_MS) return 'COUNTING';   // 剩 > 1 分鐘
  if (t < EPI_CYCLE_REAL_MS) return 'WARNING';                                // 剩 ≤ 1 分鐘
  if (t < EPI_CYCLE_REAL_MS + EPI_ALARM_INITIAL_MS) return 'ALARMING';        // 0~5s 警報
  return 'OVERTIME';
}

/** 寫入事件並回傳新事件 */
function recordEvent(type, count = 1, actualTimeNull = false) {
  if (!ohcaCase) return null;
  const ev = {
    type,
    timestamp:        Date.now(),
    elapsedSimMs:     caseElapsedSimMs(),
    count,
    actualTimeNull,
  };
  ohcaCase.events.push(ev);
  return ev;
}

/** 確認 EPI 二段成立：記錄事件 + 重啟倒數 + 清警報 */
function commitEpiLocal() {
  recordEvent('EPI_LOCAL');
  ohcaCase.lastEpiRealAt              = performance.now();
  ohcaCase.alarmingEnteredSimMs       = null;
  ohcaCase.warningLastBeepSimMs       = null;
  ohcaCase.overtimeLastReminderSimMs  = null;
  stopAlarm();
  setLed('green_flash');
  beep(1500, 80); setTimeout(() => beep(1800, 100), 120);
  vibrate(80);
}

function commitShockLocal() {
  recordEvent('SHOCK_LOCAL');
  setLed('green_flash');
  beep(1500, 80); setTimeout(() => beep(1800, 100), 120);
  vibrate(80);
}

function commitAmiodarone() {
  recordEvent('AMIODARONE');
  setLed('green_flash');
  beep(1500, 80); setTimeout(() => beep(1800, 100), 120);
  vibrate(80);
}

function commitSupp(typeStr, count) {
  recordEvent(typeStr, count, true);
  setLed('green_flash');
  beep(1200, 100); setTimeout(() => beep(1500, 120), 150);
  vibrate([80, 50, 80]);
}

// ============================================================
// SECTION 5：OHCA tick — 每 100ms 跑，依 phase 觸發輸出
// ============================================================

function ohcaTick() {
  if (!ohcaCase || ohcaCase.locked) return;
  const phase = ohcaPhase();
  const t     = sinceLastEpiSimMs();

  if (phase === 'COUNTING') {
    setLed('off');
    // STEP 01: 重置 phase 邊界 trackers，避免下次進 WARNING/ALARMING 時誤判
    ohcaCase.warningLastBeepSimMs       = null;
    ohcaCase.alarmingEnteredSimMs       = null;
    ohcaCase.overtimeLastReminderSimMs  = null;
  } else if (phase === 'WARNING') {
    setLed('yellow_slow');
    // STEP 01: 每 EPI_WARN_BEEP_MS 短嗶（用 sim ms 計，speed 加速也跟著加速）
    if (ohcaCase.warningLastBeepSimMs === null
        || t - ohcaCase.warningLastBeepSimMs >= EPI_WARN_BEEP_MS) {
      beep(880, 100);
      vibrate(60);
      ohcaCase.warningLastBeepSimMs = t;
    }
  } else if (phase === 'ALARMING') {
    setLed('red_fast');
    if (ohcaCase.alarmingEnteredSimMs === null) {
      // STEP 01: 首次進入 ALARMING，啟動連續警報
      ohcaCase.alarmingEnteredSimMs = t;
      startAlarm();
      vibrate([300, 100, 300, 100, 300]);
    }
  } else if (phase === 'OVERTIME') {
    setLed('red_slow');
    stopAlarm();
    // STEP 01: 進入超時時刻先短嗶一次，之後每 15s 提醒
    if (ohcaCase.overtimeLastReminderSimMs === null
        || t - ohcaCase.overtimeLastReminderSimMs >= EPI_OVERTIME_REMIND_MS) {
      beep(880, 100);
      vibrate(80);
      ohcaCase.overtimeLastReminderSimMs = t;
    }
  }
  render();
}

// ============================================================
// SECTION 6：通氣節奏 controller
// ============================================================

let ventState = null;  // null = 未啟動；{ startedAt, currentBeat, lastBeatRealMs, mode: 'standalone' | 'in_ohca', ohcaInterrupted, paused }

function startVent(mode) {
  ventState = {
    startedAt:        performance.now(),
    currentBeat:      0,
    lastBeatRealMs:   0,
    mode,
    ohcaInterrupted: false,
    paused:          false,  // V1 §13.11~§13.13（standalone 主鍵）/ §14.10~§14.11（in_ohca 快速功能）
  };
  ventTickFire();
}
function stopVent() {
  ventState = null;
  setLed('off');
  screenEl.classList.remove('flash-vent');
}

/** 推進到下一拍（1~6 循環） */
function ventTickFire() {
  if (!ventState) return;
  ventState.currentBeat = (ventState.currentBeat % 6) + 1;
  ventState.lastBeatRealMs = performance.now();

  // V1 §14.8：in_ohca 恆常顯示模式下，若 EPI 處於 ALARMING（請給藥）警報中，
  // 6秒給氣不蓋過 EPI 警報音，但秒數視窗仍持續更新（EPI 到期優先權）。
  const ohcaAlarming = ventState.mode === 'in_ohca' && ohcaPhase() === 'ALARMING';
  // V1 §14.7：in_ohca 模式為輔助區塊，僅更新區塊樣式，不全螢幕反紅（與 OHCA 主流程的關係）
  const fullScreenFlash = ventState.mode === 'standalone';

  if (ventState.currentBeat === 1) {
    // V1 §13.10：通氣音量 = 0 時聲音關閉，但畫面反紅 + LED 紅燈閃保留（靜音規則）
    if (!ohcaAlarming) ventBeep(1000, 200, 0.4);
    vibrate(150);
    setLed('vent_pulse');
    if (fullScreenFlash) {
      screenEl.classList.add('flash-vent');
      setTimeout(() => screenEl.classList.remove('flash-vent'), 300);
    }
  } else {
    if (!ohcaAlarming) ventBeep(800, 80, 0.2);
  }
  render();
}

/** V1 §14.9：依 ventState 動態組裝 OHCA 內快速功能選單 */
function buildQuickMenuItems() {
  const ventOn = !!ventState && ventState.mode === 'in_ohca';
  const paused = ventOn && ventState.paused;
  const items = [];
  if (!ventOn) {
    items.push({ label: '開啟6秒給氣提示', action: 'enable' });
  } else {
    items.push({ label: paused ? '繼續6秒給氣' : '暫停6秒給氣', action: paused ? 'resume' : 'pause' });
    items.push({ label: '關閉6秒給氣提示', action: 'disable' });
  }
  items.push({ label: '案件簡版總覽', action: 'summary' });
  items.push({ label: '返回 OHCA',     action: 'back' });
  return items;
}

function ventTick() {
  if (!ventState) return;
  // V1 §13.12 / §14.10：暫停期間停止秒數循環（standalone 與 in_ohca 共用）
  if (ventState.paused) return;
  const realElapsedSinceLastBeat = performance.now() - ventState.lastBeatRealMs;
  // STEP 01: 通氣節拍受 SPEED_MULT 影響（與 EPI 倒數同步加速）
  if (realElapsedSinceLastBeat * SPEED_MULT >= VENT_BEAT_REAL_MS) {
    ventTickFire();
  }
  // V1 §14.7：OHCA 內 6秒給氣為輔助子計時器，背景 OHCA EPI tick 仍要跑，
  // 不再因 EPI 到期打斷（恆常顯示），EPI 警報由 OHCA_RUNNING 主邏輯處理（與 OHCA 主流程的關係）。
  if (ventState.mode === 'in_ohca') {
    ohcaTick();
  }
}

}

    onEnter: () => {},

    onButton: (btn, kind) => {
      if (btn === 'MAIN' && kind === 'LONG') {
        // STEP 01: 長按主鍵 → 結束通氣（獨立模式）/ Demo 簡化：OHCA 內也可長按結束
        if (stateData.mode === 'standalone') {

        } else {
          // OHCA 中通氣模式長按主鍵：依 V1 §14.9 OHCA 內不使用主鍵短按作為暫停鍵，但 demo 允許長按結束
          stopVent();
          go('OHCA_RUNNING');
        }
        return;
      }
      if (btn === 'MAIN' && kind === 'SHORT' && stateData.mode === 'standalone') {
        // V1 §13.11 / §13.12：獨立模式主鍵短按 toggle 暫停 / 繼續
        // §13.13：暫停不需二段確認，誤觸再短按即繼續
        if (!ventState) return;
        ventState.paused = !ventState.paused;
        if (!ventState.paused) {
          // V1 §13.12：繼續時秒數重新從 1 開始
          ventState.currentBeat = 0;
          ventState.lastBeatRealMs = 0;
          ventTickFire();
        } else {
          setLed('off');
          screenEl.classList.remove('flash-vent');
        }
        render();
        return;
      }
      if (btn === 'BACK' && kind === 'SHORT') {
        if (stateData.mode === 'in_ohca') {
          // V1 §14.9: OHCA 內 6秒通氣透過快速功能管理；demo 簡化為返回鍵直接回 OHCA 主畫面
          stopVent();
          go('OHCA_RUNNING');
        } else {
          // V1 §13.15: 執行中按返回鍵不直接結束，提示長按主鍵
          flash('如要結束通氣節奏', '請長按主鍵', 1500, 'VENT_RUNNING', { mode: 'standalone' });
        }
        return;
      }
      if (btn === 'EPI' && kind === 'SHORT' && stateData.mode === 'in_ohca') {
        flash('請返回 OHCA', '處理 EPI', 1200, 'VENT_RUNNING', { mode: 'in_ohca' });
        return;
      }
      if (btn === 'SHOCK' && kind === 'SHORT' && stateData.mode === 'in_ohca') {
        // 通氣中允許電擊（V1 §14.7 與 OHCA 主流程的關係）；確認流程簡化為直接記錄
        commitShockLocal();
        flash('電擊已紀錄', '', FLASH_DEFAULT_MS, 'VENT_RUNNING', { mode: 'in_ohca' });
        return;
      }

      const beat = ventState ? ventState.currentBeat : 1;
      const inOhca = stateData.mode === 'in_ohca';
      const paused = !!(ventState && ventState.paused);
      // V1 §13.12 暫停畫面（獨立模式才會走到 paused=true，§14.10 OHCA 內暫停待補）
      if (paused && !inOhca) {

            <div style="font-size:48px;color:#fbbf24;margin-top:16px;font-weight:bold">已暫停</div>

          </div>
        `;
        overlay.classList.remove('show');
        return;
      }
      let epiHint = '';
      if (inOhca && ohcaCase) {
        const phase = ohcaPhase();
        const t = sinceLastEpiSimMs();
        if (phase === 'WAIT_FIRST_EPI') {
          epiHint = `<div class="scr-vent-epi-hint">EPI 待第一次</div>`;
        } else if (phase === 'COUNTING') {
          const remaining = Math.max(0, EPI_CYCLE_REAL_MS - t);
          epiHint = `<div class="scr-vent-epi-hint">EPI ${formatMMSS(remaining)}</div>`;
        } else if (phase === 'WARNING') {
          const remaining = Math.max(0, EPI_CYCLE_REAL_MS - t);
          epiHint = `<div class="scr-vent-epi-hint warning">EPI ${formatMMSS(remaining)}｜請準備給藥</div>`;
        } else if (phase === 'OVERTIME') {
          epiHint = `<div class="scr-vent-epi-hint alarm">EPI ${formatMMSS(t)}｜請給藥</div>`;
        }
      }
      screenContent.innerHTML = `
        <div style="text-align:center;width:100%;position:relative">
          ${inOhca ? '<div class="scr-mode" style="color:#fbbf24">OHCA 中</div>' : '<div class="scr-mode">6 秒通氣節奏</div>'}
          <div class="scr-vent-num ${beat === 1 ? 'emphasis' : ''}">${beat}</div>
          <div class="scr-vent-label">${beat === 1 ? '吹氣 ◉' : `${beat}/6`}</div>
          ${epiHint}
        </div>
      `;
      overlay.classList.remove('show');
    },
  },

      // STEP 01: 主鍵 — 長按進操作選單（V1 §15.4）；短按在 ALARMING 解除警報
      if (btn === 'MAIN') {
        if (kind === 'LONG') {
          go('TRAINING_OPTIONS', { cursor: 0 });
        } else if (trainingCase.alarming) {
          stopAlarm();
          setLed('off');
        }
        return;
      }
      // STEP 02: EPI 長按 — 進 EPI / 藥物選單（對齊 V1 §15.9）
      if (btn === 'EPI' && kind === 'LONG') {
        go('TRAINING_DRUG_MENU', { cursor: 0 });
        return;
      }
      // STEP 03: EPI 短按 — 兩段確認（對齊 V1 §15.5）
      if (btn === 'EPI' && kind === 'SHORT') {
        stopAlarm(); setLed('off');
        go('TRAINING_CONFIRM', { evType: 'EPI', label: '確認已給 EPI？', confirmKey: 'EPI' });
        return;
      }
      // STEP 04: 電擊短按 — 兩段確認（對齊 V1 §15.8）
      if (btn === 'SHOCK' && kind === 'SHORT') {
        go('TRAINING_CONFIRM', { evType: 'SHOCK', label: '確認已電擊？', confirmKey: 'SHOCK' });
        return;
      }
    },
    render: () => {
      if (!trainingCase) return;
      const counts = trainingCountLocal();
      const hint = '長按主鍵 = 操作選單';
      // STEP 00: V1 §15.4 — 待本機 EPI 階段（cycleStartedAt 尚未啟動）
      if (trainingCase.cycleStartedAt === null) {
        screenEl.classList.remove('flash-red');
        screenContent.innerHTML = `
          <div class="scr-mode" style="color:#60a5fa">訓練模式</div>
          <div class="scr-flash-msg" style="margin-top:12px;font-size:29px">待本機 EPI</div>
          <div class="scr-flash-sub" style="margin-top:8px">案件開始 ≠ 倒數開始<br>第一筆 EPI 確認後啟動倒數</div>
          <div class="scr-counter" style="margin-top:24px">EPI ${counts.epi}｜電擊 ${counts.shock}${counts.amio ? `｜Amio ${counts.amio}` : ''}</div>
          <div class="scr-counter" style="font-size:18px;color:#64748b;margin-top:4px">${hint}</div>
        `;
        overlay.classList.remove('show');
        return;
      }
      const elapsed = trainingCycleElapsedSimMs();
      const remaining = Math.max(0, trainingCase.durationMs - elapsed);
      const expired = elapsed >= trainingCase.durationMs;
      let timeStr, label, timeClass = '';
      // STEP 01: 過期 → ALARMING（解除靠按 EPI 重啟倒數，仿 OHCA §6.7）
      if (expired) {
        timeStr  = '00:00';
        label    = '請給藥';
        timeClass = 'scr-time-red';
        if (!trainingCase.alarming) {
          trainingCase.alarming = true;
          startAlarm();
          setLed('red_fast');
          vibrate([300, 100, 300]);
        }
        screenEl.classList.add('flash-red');
      } else {
        timeStr = formatMMSS(remaining);
        // V1 §15.7：4 分鐘訓練剩 1 分鐘時顯示「請準備給藥」；30s/1min 不顯示
        const isFourMin = trainingCase.durationMs === 240_000;
        label = (isFourMin && remaining <= 60_000) ? '請準備給藥' : '下次給藥';
        if (isFourMin && remaining <= 60_000) timeClass = 'scr-time-amber';
        screenEl.classList.remove('flash-red');
      }
      // STEP 02: render 對齊 V1 §15.6（訓練模式 / 倒數 / 下次給藥 / EPI N｜電擊 N）
      screenContent.innerHTML = `
        <div class="scr-mode" style="color:#60a5fa">訓練模式</div>
        <div class="scr-time-big ${timeClass}">${timeStr}</div>
        <div class="scr-label">${label}</div>
        <div class="scr-counter">EPI ${counts.epi}｜電擊 ${counts.shock}${counts.amio ? `｜Amio ${counts.amio}` : ''}</div>
        <div class="scr-counter" style="font-size:18px;color:#64748b;margin-top:4px">${hint}</div>
      `;
      overlay.classList.remove('show');
    },
  },

/** ms → "MM:SS" */
function formatMMSS(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const mm = String(Math.floor(s / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  return `${mm}:${ss}`;
}
/** epoch ms → "HH:MM" */
function formatTime(epochMs) {
  const d = new Date(epochMs);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function countLocal() {
  if (!ohcaCase) return { epi: 0, shock: 0 };
  let epi = 0, shock = 0;
  ohcaCase.events.forEach(e => {
    if (e.type === 'EPI_LOCAL')   epi   += 1;
    if (e.type === 'SHOCK_LOCAL') shock += 1;
  });
  return { epi, shock };
}

function countAll() {
  const c = {
    epi:   { total: 0, local: 0, preHandover: 0, pureSupp: 0 },
    shock: { total: 0, local: 0, preHandover: 0, pureSupp: 0 },
    amio:  0,
  };
  if (!ohcaCase) return c;
  ohcaCase.events.forEach(e => {
    const n = e.count;
    if (e.type === 'EPI_LOCAL')          { c.epi.local += 1;        c.epi.total += 1; }
    if (e.type === 'EPI_PRE_HANDOVER')   { c.epi.preHandover += n;  c.epi.total += n; }
    if (e.type === 'EPI_PURE_SUPP')      { c.epi.pureSupp += n;     c.epi.total += n; }
    if (e.type === 'SHOCK_LOCAL')        { c.shock.local += 1;      c.shock.total += 1; }
    if (e.type === 'SHOCK_PRE_HANDOVER') { c.shock.preHandover += n;c.shock.total += n; }
    if (e.type === 'SHOCK_PURE_SUPP')    { c.shock.pureSupp += n;   c.shock.total += n; }
    if (e.type === 'AMIODARONE')         { c.amio += 1; }
  });
  return c;
}

// === History 持久化 ===

/** 從 localStorage 讀歷史紀錄；解析失敗回空陣列 */
function loadHistory(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (_) { return []; }
}
/** 寫回 localStorage（FIFO，超過 limit 則砍掉最舊） */
function saveHistory(key, arr, limit) {
  const trimmed = arr.slice(-limit);
  try { localStorage.setItem(key, JSON.stringify(trimmed)); } catch (_) {}
}

/** OHCA 結束鎖定時，把 case 寫入歷史（FIFO 50） */
function persistOhcaCase() {
  if (!ohcaCase) return;
  const arr = loadHistory(HISTORY_OHCA_KEY);
  const startEpoch = Date.now() - (performance.now() - ohcaCase.startedAt);
  arr.push({
    kind:        'ohca',
    startedAt:   startEpoch,
    endedAt:     Date.now(),
    events:      ohcaCase.events,
    deviceName:  DEVICE_MOCK.name,
    fwVersion:   DEVICE_MOCK.fwVersion,
    syncedToApp: false,
  });
  saveHistory(HISTORY_OHCA_KEY, arr, HISTORY_OHCA_LIMIT);
}

/** Training case 結構（V1 §15：演練 OHCA EPI 倒數） */
let trainingCase = null;
function newTrainingCase(durationMs) {
  const now = performance.now();
  trainingCase = {
    sessionStartedAt: now,        // 整段 training 起點（事件時間軸 / 保存用）
    cycleStartedAt:   null,       // V1 §15.4：null = 待本機 EPI（第一筆 EPI 後才啟動倒數）
    durationMs,
    events:           [],         // {type:'EPI_LOCAL'|'SHOCK_LOCAL'|'AMIODARONE', timestamp, elapsedSimMs}
    alarming:         false,
    fromHistory:      false,      // 由歷史紀錄重建時設 true，render 走 read-only
  };
}
/** Training 整段 session 起算的模擬毫秒（含加速） */
function trainingSessionElapsedSimMs() {
  if (!trainingCase) return 0;
  return (performance.now() - trainingCase.sessionStartedAt) * SPEED_MULT;
}
/** Training 當前倒數週期經過毫秒（按 EPI 重設）；待本機 EPI 階段返回 0 */
function trainingCycleElapsedSimMs() {
  if (!trainingCase || trainingCase.cycleStartedAt === null) return 0;
  return (performance.now() - trainingCase.cycleStartedAt) * SPEED_MULT;
}
/** Training EPI / 電擊 / Amiodarone 累計次數 */
function trainingCountLocal() {
  if (!trainingCase) return { epi: 0, shock: 0, amio: 0 };
  let epi = 0, shock = 0, amio = 0;
  trainingCase.events.forEach(e => {
    if (e.type === 'EPI_LOCAL')   epi   += 1;
    if (e.type === 'SHOCK_LOCAL') shock += 1;
    if (e.type === 'AMIODARONE')  amio  += 1;
  });
  return { epi, shock, amio };
}
/** Training 寫入事件 */
function trainingRecordEvent(type) {
  if (!trainingCase) return;
  trainingCase.events.push({
    type,
    timestamp:    Date.now(),
    elapsedSimMs: trainingSessionElapsedSimMs(),
  });
}
/** Training EPI 二段確認成立：記錄 + 啟動/重啟倒數 + 清警報（V1 §15.4 第一筆 EPI 啟動倒數） */
function trainingCommitEpi() {
  if (!trainingCase) return;
  trainingRecordEvent('EPI_LOCAL');
  trainingCase.cycleStartedAt = performance.now();
  trainingCase.alarming       = false;
  stopAlarm();
  setLed('green_flash');
  beep(1500, 80); setTimeout(() => beep(1800, 100), 120);
  vibrate(80);
}
/** Training 電擊二段確認成立：只記錄，不影響倒數（V1 §15.8） */
function trainingCommitShock() {
  if (!trainingCase) return;
  trainingRecordEvent('SHOCK_LOCAL');
  setLed('green_flash');
  beep(1500, 80); setTimeout(() => beep(1800, 100), 120);
  vibrate(80);
}
/** Training Amiodarone 二段確認成立：只記錄，不影響倒數（V1 §15.9） */
function trainingCommitAmio() {
  if (!trainingCase) return;
  trainingRecordEvent('AMIODARONE');
  setLed('green_flash');
  beep(1500, 80); setTimeout(() => beep(1800, 100), 120);
  vibrate(80);
}
/** Training 結束（保存 / 不保存） */
function persistTrainingCase() {
  if (!trainingCase) return;
  const arr = loadHistory(HISTORY_TRAINING_KEY);
  const startEpoch = Date.now() - (performance.now() - trainingCase.sessionStartedAt);
  arr.push({
    kind:        'training',
    startedAt:   startEpoch,
    endedAt:     Date.now(),
    durationMs:  trainingCase.durationMs,
    events:      trainingCase.events.slice(),
  });
  saveHistory(HISTORY_TRAINING_KEY, arr, HISTORY_TRAINING_LIMIT);
}

/** V1 §15.16：刪除指定 index 的 Training 紀錄（OHCA 不適用） */
function deleteTrainingHistoryAt(idx) {
  const arr = loadHistory(HISTORY_TRAINING_KEY);
  if (idx < 0 || idx >= arr.length) return;
  arr.splice(idx, 1);
  try { localStorage.setItem(HISTORY_TRAINING_KEY, JSON.stringify(arr)); } catch (_) {}
}

function eventLabel(e) {
  switch (e.type) {
    case 'EPI_LOCAL':          return `EPI #${countTypeBefore(e, 'EPI_LOCAL')}`;
    case 'SHOCK_LOCAL':        return `電擊 #${countTypeBefore(e, 'SHOCK_LOCAL')}`;
    case 'AMIODARONE':         return 'Amiodarone';
    case 'EPI_PRE_HANDOVER':   return `接手前 EPI ×${e.count}`;
    case 'EPI_PURE_SUPP':      return `純補登 EPI ×${e.count}`;
    case 'SHOCK_PRE_HANDOVER': return `接手前電擊 ×${e.count}`;
    case 'SHOCK_PURE_SUPP':    return `純補登電擊 ×${e.count}`;
    default: return e.type;
  }
}
function countTypeBefore(target, type) {
  let n = 0;
  for (const e of ohcaCase.events) {
    if (e.type === type) n += 1;
    if (e === target) return n;
  }
  return n;
}

// ============================================================
// SECTION 10：按鍵 input 處理（短按 / 長按）
// ============================================================

let pressTimers = {};   // btn → timeoutId
let longFired   = {};   // btn → bool

function bindButton(el) {
  const btn = el.dataset.btn;

  const onDown = (e) => {
    e.preventDefault();
    ensureAudio();
    longFired[btn] = false;
    // STEP 01: 立即加 .pressing class 觸發 CSS 進度填充動畫（0.75s linear）
    el.classList.remove('long-fired');
    el.classList.add('pressing');
    pressTimers[btn] = setTimeout(() => {
      // STEP 02: 達門檻 → 切換為 long-fired（持續高亮）+ fire-on-hold 立即觸發
      longFired[btn] = true;
      el.classList.remove('pressing');
      el.classList.add('long-fired');
      vibrate(40);
      handleButton(btn, 'LONG');
    }, LONG_PRESS_THRESHOLD_MS);
  };

  const onUp = (e) => {
    e.preventDefault();
    clearTimeout(pressTimers[btn]);
    el.classList.remove('pressing', 'long-fired');
    if (!longFired[btn]) {
      handleButton(btn, 'SHORT');
    }
    longFired[btn] = false;
  };

  const onCancel = () => {
    clearTimeout(pressTimers[btn]);
    el.classList.remove('pressing', 'long-fired');
    longFired[btn] = false;
  };

  el.addEventListener('touchstart',  onDown,   { passive: false });
  el.addEventListener('touchend',    onUp,     { passive: false });
  el.addEventListener('touchcancel', onCancel);
  el.addEventListener('mousedown',   onDown);
  el.addEventListener('mouseup',     onUp);
  el.addEventListener('mouseleave',  onCancel);
}

function handleButton(btn, kind) {
  if (STATES[currentState]?.onButton) {
    STATES[currentState].onButton(btn, kind);
  }
}

document.querySelectorAll('[data-btn]').forEach(bindButton);

// Speed toggle 切換循環
const SPEED_OPTIONS = [1, 4, 8, 16, 32];
const speedToggle = document.getElementById('speed-toggle');
function refreshSpeedBadge() { speedToggle.textContent = `${SPEED_MULT}x ⏵`; }
speedToggle.addEventListener('click', () => {
  const next = SPEED_OPTIONS[(SPEED_OPTIONS.indexOf(SPEED_MULT) + 1) % SPEED_OPTIONS.length];
  const url = new URL(location.href);
  url.searchParams.set('speed', `${next}x`);
  location.href = url.toString();
});
refreshSpeedBadge();

// ============================================================
// SECTION 11：global ticker + boot
// ============================================================

/** 不該繼續觸發 OHCA tick 的 state（總覽 / 時間軸 / 結束確認流程） */
const OHCA_NO_TICK = new Set(['OHCA_SUMMARY', 'OHCA_TIMELINE', 'OHCA_END_CHECK', 'OHCA_END_CONFIRM']);

setInterval(() => {
  if (currentState && currentState.startsWith('OHCA_') && !OHCA_NO_TICK.has(currentState)) {
    ohcaTick();
  }
  if (ventState) {
    ventTick();
  }
  if (currentState === 'TRAINING_RUNNING' && trainingCase) {
    render();
  }
}, TICK_INTERVAL_MS);

// 啟動：套用持久化的螢幕亮度，再進主功能表
applyBrightness();
go('MAIN_MENU', { cursor: 0 });
</script>
